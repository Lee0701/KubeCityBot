bot-token:
server-id:
icon-storage:
  use: true
  url: https://api.mineatar.io/face/%s
status-updater:
  use: false
broadcaster:
  use: false
  channels: []
simple-forwarder:
  use: false
  message-type: webhook
  channels: []
translator-forwarder:
  use: false
  message-type: webhook
  channels: []
  languages:
    - en_US
    - ko_KR
channel-forwarder:
  use: false
  message-type: webhook
  prefix: '#'
  format: '§r%1$s <%%1$s> %%2$s'
  channels:
    - discordChannelId shortName
  default-listening-channels:
    - shortName
  default-speaking-channels:
    - shortName
group-linker:
  use: false
  context-key: discord:role
building-storage:
  use: false
  show-hologram: true
  api-endpoint:
  category-name:
  wiki-url:
  register-preload:
building-votes:
  use: false
builder-level:
  use: false
  require-role: discordRoleName
  broadcast-channels:
    - discordChannelId